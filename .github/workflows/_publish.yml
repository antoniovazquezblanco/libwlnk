name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: The version meson derived, as the tarball carries it.
        required: true
        type: string

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch the package tarball
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check the tag matches the built version
        env:
          BUILT: ${{ inputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, built $BUILT"
          [ "$tag" = "$BUILT" ] || {
              echo "::error::tag v$tag does not match the derived version $BUILT"
              exit 1
          }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
