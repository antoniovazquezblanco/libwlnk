name: Pre-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Clang format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git ls-files '*.c' '*.h' '*.cpp' |
            xargs clang-format-18 --dry-run --Werror

  license:
    name: Licensing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install reuse
        run: pipx install reuse
      - name: Source file licensing
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.in' '*.sh' '*.py' |
            xargs reuse lint-file
      - name: REUSE compliance
        run: reuse lint

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          git ls-files '*.sh' | xargs shellcheck
      - name: Python syntax
        run: git ls-files '*.py' | xargs -I{} python3 -m py_compile {}
