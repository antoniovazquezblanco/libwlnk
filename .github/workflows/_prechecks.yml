name: Pre-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Clang format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          git ls-files '*.c' '*.h' '*.cpp' |
            xargs clang-format-18 --dry-run --Werror
