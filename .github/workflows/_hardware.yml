name: Hardware

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hwsim:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac80211_hwsim
          - name: mac80211_hwsim, NetworkManager
            owner: NetworkManager
            packages: network-manager
            tests: wlnk_nm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libcmocka-dev \
            libnl-3-dev libnl-genl-3-dev libsystemd-dev ${{ matrix.packages }}
          pipx install meson
      - name: Load the simulated radios
        run: |
          if ! modinfo mac80211_hwsim >/dev/null 2>&1; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          fi
          if sudo modprobe mac80211_hwsim radios=2; then
            echo "WLNK_TEST_NL80211=1" >> "$GITHUB_ENV"
            ls /sys/class/ieee80211
            # The first simulated interface is the one tests may change.
            for d in /sys/class/net/*/phy80211; do
              [ -e "$d" ] || continue
              echo "WLNK_TEST_IFACE=$(basename "$(dirname "$d")")" >> "$GITHUB_ENV"
              break
            done
          else
            echo "::warning title=No simulated radio::mac80211_hwsim is unavailable for kernel $(uname -r); the netlink tests will skip."
          fi
      - name: Let NetworkManager manage the simulated radios
        if: matrix.owner == 'NetworkManager' && env.WLNK_TEST_IFACE != ''
        run: |
          # Wi-Fi only: the runner's own network is left where it is.
          printf '[keyfile]\nunmanaged-devices=*,except:type:wifi\n' |
            sudo tee /etc/NetworkManager/conf.d/90-wlnk-ci.conf
          sudo systemctl restart NetworkManager
          for _ in $(seq 30); do
            case "$(nmcli -g GENERAL.STATE device show "$WLNK_TEST_IFACE" 2>/dev/null)" in
              '' | '10 '*) sleep 1 ;;
              *) echo "WLNK_TEST_NM=1" >> "$GITHUB_ENV"; exit 0 ;;
            esac
          done
          nmcli device status
          echo "::error title=Not managed::NetworkManager does not manage $WLNK_TEST_IFACE."
          exit 1
      - name: Configure
        run: meson setup build --werror
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs ${{ matrix.tests }}
      - name: Test as root
        run: sudo -E env "PATH=$PATH" meson test -C build --print-errorlogs ${{ matrix.tests }}
