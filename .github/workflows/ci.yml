name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prechecks:
    name: Pre-checks
    uses: ./.github/workflows/_prechecks.yml

  platforms:
    name: Platforms
    needs: prechecks
    uses: ./.github/workflows/_platforms.yml

  build-test:
    name: Build and test
    needs: platforms
    uses: ./.github/workflows/_build-test.yml

  hardware:
    name: Hardware
    needs: build-test
    uses: ./.github/workflows/_hardware.yml

  packaging:
    name: Packaging
    needs: hardware
    uses: ./.github/workflows/_package.yml

  publish:
    name: Publish
    needs: packaging
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      version: ${{ needs.packaging.outputs.version }}
