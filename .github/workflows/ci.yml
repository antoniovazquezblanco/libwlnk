name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prechecks:
    name: Pre-checks
    uses: ./.github/workflows/_prechecks.yml

  platforms:
    name: Platforms
    needs: prechecks
    uses: ./.github/workflows/_platforms.yml

  build-test:
    name: Build and test
    needs: platforms
    uses: ./.github/workflows/_build-test.yml

  packaging:
    name: Packaging
    needs: build-test
    uses: ./.github/workflows/_package.yml
