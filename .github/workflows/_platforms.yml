name: Platforms

on:
  workflow_call:

permissions:
  contents: read

jobs:
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.optional || false }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04
            install: >-
              apt-get update && apt-get install -y
              git meson ninja-build pkg-config build-essential
              libcmocka-dev libnl-3-dev libnl-genl-3-dev

          - name: Kali
            image: kalilinux/kali-last-release
            install: >-
              apt-get update && apt-get install -y
              git meson ninja-build pkg-config build-essential
              libcmocka-dev libnl-3-dev libnl-genl-3-dev
            optional: true

          - name: Alpine 3.22
            image: alpine:3.22
            install: >-
              apk add --no-cache
              git build-base meson pkgconf cmocka-dev libnl3-dev linux-headers

    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Report Meson version
        run: |
          echo "floor:  $(sed -n "s/.*meson_version: *'>= *\([0-9.]*\)'.*/\1/p" meson.build)"
          echo "distro: $(meson --version)"

      - name: Configure
        run: meson setup build
